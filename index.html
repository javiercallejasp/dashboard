<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEETMIND Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; min-height: 100vh; }
        .sidebar { width: 210px; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); padding: 24px 16px; color: #e0e7ff; position: fixed; height: 100vh; overflow-y: auto; }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
        .logo-circle { width: 36px; height: 36px; background: linear-gradient(135deg, #d946ef 0%, #0ea5e9 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 18px; }
        .logo-text .title { font-size: 14px; font-weight: 700; color: white; }
        .logo-text .subtitle { font-size: 9px; color: #a5b4fc; text-transform: uppercase; letter-spacing: 0.5px; }
        .main { margin-left: 210px; flex: 1; padding: 32px; overflow-y: auto; }
        .header-left h1 { font-size: 28px; color: #111; font-weight: 600; margin-bottom: 4px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .kpi-card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e5e7eb; }
        .kpi-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 8px; }
        .kpi-icon.green { background: #dcfce7; }
        .kpi-label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 500; margin-bottom: 8px; }
        .kpi-number { font-size: 32px; font-weight: 700; color: #111; }
        .content-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 24px; }
        .card { background: white; border-radius: 12px; padding: 24px; border: 1px solid #e5e7eb; }
        .card h2 { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 16px; }
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .workload-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f9fafb; border-radius: 8px; margin-bottom: 12px; }
        .workload-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; font-size: 12px; }
        .workload-info { flex: 1; }
        .workload-name { font-size: 13px; font-weight: 600; color: #111; }
        .workload-tasks { font-size: 12px; color: #9ca3af; }
        .workload-progress { width: 50px; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
        .workload-progress-bar { height: 100%; background: linear-gradient(90deg, #7c3aed 0%, #6366f1 100%); }
        .activity-item { display: flex; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #f3f4f6; margin-bottom: 12px; }
        .activity-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; font-size: 12px; }
        .activity-text { font-size: 13px; color: #111; }
        .activity-time { font-size: 12px; color: #9ca3af; }
        .meeting-badge { display: inline-block; background: #eef2ff; color: #7c3aed; padding: 4px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; margin-bottom: 12px; }
        .meeting-title { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 12px; }
        .meeting-meta { font-size: 12px; color: #6b7280; margin-bottom: 16px; }
        .meeting-stats { display: flex; gap: 24px; padding-top: 16px; border-top: 1px solid #f3f4f6; }
        .stat { text-align: center; }
        .stat-number { font-size: 20px; font-weight: 700; color: #111; }
        .stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-top: 4px; }
        @media (max-width: 1400px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .content-grid { grid-template-columns: 1fr; } .bottom-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <div class="logo-circle">∞</div>
            <div class="logo-text">
                <div class="title">MEETMIND</div>
                <div class="subtitle">Control Center</div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="header-left">
            <h1 id="greeting">Good morning, Javier</h1>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon green">✓</div>
                <div class="kpi-label">Total tasks</div>
                <div class="kpi-number" id="totalTasks">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon green">✓</div>
                <div class="kpi-label">Completed</div>
                <div class="kpi-number" id="completedTasks">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon green">✓</div>
                <div class="kpi-label">In progress</div>
                <div class="kpi-number" id="inProgressTasks">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon green">✓</div>
                <div class="kpi-label">Pending</div>
                <div class="kpi-number" id="pendingTasks">0</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <h2>Recent activity</h2>
                <div id="activityFeed"></div>
            </div>

            <div class="card">
                <h2>Project progress</h2>
                <div id="projectProgress"></div>
            </div>
        </div>

        <div class="bottom-grid">
            <div class="card">
                <h2>Team workload</h2>
                <div id="teamWorkload"></div>
            </div>

            <div class="card">
                <div class="meeting-badge">MTG-2026-001</div>
                <div class="meeting-title" id="meetingTitle">Loading...</div>
                <div class="meeting-meta" id="meetingMeta">Loading...</div>
                <div class="meeting-stats">
                    <div class="stat">
                        <div class="stat-number" id="meetingTasks">0</div>
                        <div class="stat-label">Tasks</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="meetingDecisions">0</div>
                        <div class="stat-label">Decisions</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="meetingRisks">0</div>
                        <div class="stat-label">Risks</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1gSHt9LpZXrwbRBR7C1-hBL-mAiFz1liB2BeIc-yClkw';
        const TABS = {
            executive: 740446607,
            participants: 1025216466,
            actionItems: 386908148,
            risks: 1029388352
        };

        const colors = ['#d946ef', '#06b6d4', '#8b5cf6'];

        async function fetchCSV(gid) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
            console.log('Fetching:', url);
            
            const res = await fetch(url);
            const text = await res.text();
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
            
            const data = lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.replace(/"/g, '').trim());
                const row = {};
                headers.forEach((h, i) => row[h] = values[i] || '');
                return row;
            });

            console.log('Headers:', headers);
            console.log('Rows:', data);
            return data;
        }

        async function main() {
            console.log('=== INICIANDO ===');
            
            const exec = await fetchCSV(TABS.executive);
            const part = await fetchCSV(TABS.participants);
            const items = await fetchCSV(TABS.actionItems);
            const risk = await fetchCSV(TABS.risks);

            console.log('EXECUTIVE:', exec);
            console.log('PARTICIPANTS:', part);
            console.log('ITEMS:', items);
            console.log('RISKS:', risk);

            // KPI
            const completed = items.filter(i => i.Status?.toLowerCase() === 'completed').length;
            const inProgress = items.filter(i => i.Status?.toLowerCase() === 'in progress').length;
            const pending = items.filter(i => i.Status?.toLowerCase() === 'pending').length;

            document.getElementById('totalTasks').textContent = items.length;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('inProgressTasks').textContent = inProgress;
            document.getElementById('pendingTasks').textContent = pending;

            // ACTIVITY
            let actHtml = '';
            part.forEach((p, i) => {
                actHtml += `
                    <div class="activity-item">
                        <div class="activity-avatar" style="background: ${colors[i % 3]};">${p.Name?.charAt(0) || '?'}</div>
                        <div>
                            <div class="activity-text"><strong>${p.Name || 'Unknown'}</strong> completed task</div>
                            <div class="activity-time">Recently</div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('activityFeed').innerHTML = actHtml;

            // TEAM
            let teamHtml = '';
            part.forEach((person, i) => {
                const personTasks = items.filter(it => it.Responsible === person.Name);
                const done = personTasks.filter(it => it.Status?.toLowerCase() === 'completed').length;
                const pct = personTasks.length > 0 ? (done / personTasks.length * 100) : 0;

                teamHtml += `
                    <div class="workload-item">
                        <div class="workload-avatar" style="background: ${colors[i % 3]};">${person.Name?.charAt(0) || '?'}</div>
                        <div class="workload-info">
                            <div class="workload-name">${person.Name || 'Unknown'}</div>
                            <div class="workload-tasks">${personTasks.length} tasks · ${done} done</div>
                        </div>
                        <div class="workload-progress">
                            <div class="workload-progress-bar" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('teamWorkload').innerHTML = teamHtml;

            // MEETING
            if (exec.length > 0) {
                const e = exec[0];
                document.getElementById('meetingTitle').textContent = e['Meeting Title'] || 'Untitled';
                document.getElementById('meetingMeta').textContent = (e['Executive Summary'] || '').substring(0, 100) + '...';
                document.getElementById('meetingTasks').textContent = items.length;
                document.getElementById('meetingDecisions').textContent = e['Key Decisions'] ? 1 : 0;
                document.getElementById('meetingRisks').textContent = risk.length;
            }

            console.log('=== COMPLETADO ===');
        }

        window.addEventListener('load', main);
    </script>
</body>
</html>
